apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-task-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: prajwal1050/worker:v5
        env:
        - name: MONGO_URI
          value: "mongodb+srv://b210093_db_user:iidVYjcx7vK794FK@cluster0.xyitwlh.mongodb.net/ai-tasks?appName=Cluster0"
        - name: REDIS_URL
          value: "redis://redis:6379"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
